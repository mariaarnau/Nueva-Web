<style>

  .kinetic-text { position:absolute; font-family:'Fraunces',serif; font-weight:300; font-size:104px; line-height:1.05; color:#faf8ef; text-align:center; opacity:0; letter-spacing:0.5px; text-shadow: 0 4px 40px rgba(0,0,0,0.4); }
  .top-bar { position:absolute; top:70px; left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
  .top-bar img { width:64px; height:auto; opacity:0.92; }
  .progress-track { position:absolute; top:56px; left:60px; right:60px; height:4px; background:rgba(255,255,255,0.18); border-radius:4px; z-index:5; overflow:hidden; }
  .progress-fill { height:100%; background:#d4dbb0; border-radius:4px; width:0%; animation: progressAnim 26.599999999999998s linear forwards; }
