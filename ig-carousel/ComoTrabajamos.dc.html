<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root{
      --ink:#262620; --ink-soft:#3d3d35; --ink-mute:#77766c;
      --olive:#5c6a45; --olive-dark:#3d4630;
      --cream:#f1efe2;
      --line: rgba(38,38,32,0.14);
    }
    body{margin:0;font-family:"Inter",-apple-system,sans-serif;}
  </style>
</helmet>
<div style="width:1080px;height:1350px;background:var(--cream);position:relative;display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:72px 72px 0 72px;display:flex;flex-direction:column;gap:8px;">
    <div style="font-family:'Inter',sans-serif;font-weight:600;font-size:15px;letter-spacing:3px;color:var(--olive-dark);text-transform:uppercase;">Cómo trabajamos</div>
    <div style="font-family:'Fraunces',serif;font-weight:300;font-size:46px;line-height:1.18;color:var(--ink);max-width:880px;">Sin complicaciones para el equipo de RRHH.</div>
  </div>

  <div style="margin:40px 72px 0 72px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:16px;">
    <div style="border-radius:4px;overflow:hidden;height:400px;">
      <img src="actividad-crossfit-grupo.jpg" style="width:100%;height:100%;object-fit:cover;display:block;" />
    </div>
    <div style="border-radius:4px;overflow:hidden;height:400px;">
      <img src="actividad-yoga-pilates-grupo.jpg" style="width:100%;height:100%;object-fit:cover;display:block;" />
    </div>
  </div>

  <div style="margin:48px 72px 0 72px;display:flex;flex-direction:column;gap:26px;">
    <div style="display:flex;gap:20px;align-items:flex-start;">
      <div style="font-family:'Fraunces',serif;font-weight:400;font-size:22px;color:var(--olive-dark);min-width:36px;">01</div>
      <div style="font-family:'Inter',sans-serif;font-size:18px;line-height:1.55;color:var(--ink-soft);">Diseñamos el programa a medida de tu empresa: tamaño, sector y objetivos.</div>
    </div>
    <div style="height:1px;background:var(--line);"></div>
    <div style="display:flex;gap:20px;align-items:flex-start;">
      <div style="font-family:'Fraunces',serif;font-weight:400;font-size:22px;color:var(--olive-dark);min-width:36px;">02</div>
      <div style="font-family:'Inter',sans-serif;font-size:18px;line-height:1.55;color:var(--ink-soft);">Impartimos las sesiones con nuestro propio equipo de profesionales.</div>
    </div>
    <div style="height:1px;background:var(--line);"></div>
    <div style="display:flex;gap:20px;align-items:flex-start;">
      <div style="font-family:'Fraunces',serif;font-weight:400;font-size:22px;color:var(--olive-dark);min-width:36px;">03</div>
      <div style="font-family:'Inter',sans-serif;font-size:18px;line-height:1.55;color:var(--ink-soft);">Coordinamos calendario, material y logística de principio a fin.</div>
    </div>
  </div>

  <div style="margin-top:auto;padding:40px 72px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
    <div style="font-family:'Inter',sans-serif;font-weight:600;font-size:14px;letter-spacing:2px;color:var(--olive-dark);">BOOST WELLNESS</div>
    <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:14px;letter-spacing:1px;color:var(--ink-mute);">04 / 06</div>
  </div>
</div>
</x-dc>
</body>
</html>
