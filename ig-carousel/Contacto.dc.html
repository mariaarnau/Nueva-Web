<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root{
      --ink-deep:#1d2018;
      --olive-dark:#3d4630;
      --cream:#f1efe2;
      --cream-mute: rgba(241,239,226,0.68);
      --line-soft: rgba(241,239,226,0.18);
    }
    body{margin:0;font-family:"Inter",-apple-system,sans-serif;}
    a{color:var(--cream);text-decoration:none;}
  </style>
</helmet>
<div style="width:1080px;height:1350px;background:radial-gradient(120% 90% at 50% 82%, var(--olive-dark) 0%, var(--ink-deep) 62%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;">

  <div style="display:flex;flex-direction:column;align-items:center;gap:56px;z-index:1;">
    <img src="logo-light.png" alt="Boost Wellness" style="width:140px;height:auto;" />

    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div style="font-family:'Fraunces',serif;font-weight:300;font-size:42px;line-height:1.2;color:var(--cream);text-align:center;">Hablemos del<br/>bienestar de tu equipo.</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:8px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="font-family:'Inter',sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;color:var(--cream-mute);text-transform:uppercase;">Email</div>
        <div style="font-family:'Fraunces',serif;font-size:24px;color:var(--cream);">boostwellness.info@gmail.com</div>
      </div>
      <div style="width:64px;height:1px;background:var(--line-soft);"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="font-family:'Inter',sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;color:var(--cream-mute);text-transform:uppercase;">Teléfono</div>
        <div style="font-family:'Fraunces',serif;font-size:24px;color:var(--cream);">+34 614 374 306</div>
      </div>
      <div style="width:64px;height:1px;background:var(--line-soft);"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="font-family:'Inter',sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;color:var(--cream-mute);text-transform:uppercase;">Web</div>
        <div style="font-family:'Fraunces',serif;font-size:24px;color:var(--cream);">boostwellness.es</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;bottom:56px;left:0;right:0;display:flex;justify-content:center;">
    <div style="font-family:'Inter',sans-serif;font-size:14px;letter-spacing:2px;color:var(--cream-mute);">VALENCIA · ESPAÑA</div>
  </div>
</div>
</x-dc>
</body>
</html>
