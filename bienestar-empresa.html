<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Galiana — Bienestar para tu empresa</title>
<meta name="description" content="La Galiana, incrustada en su propia pantalla.">
<link rel="preload" as="image" href="assets/img/spa-piscina-cine.webp" fetchpriority="high">
<style>
  :root{
    --sala:#0a0a09;
    --sala-2:#050504;
    --marco:#1c1a15;
    --brillo: rgba(246,238,214,.14);
    --sub:#cfc6ae;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--sala); }
  body{ font-family: Georgia, "Times New Roman", serif; }
  img{ display:block; max-width:100%; }

  /* la sala: fondo oscuro constante que envuelve la pantalla */
  .sala{
    position:relative;
    height:280vh;
    background: radial-gradient(120% 90% at 50% 30%, #141310 0%, var(--sala) 45%, var(--sala-2) 100%);
  }
  .sala__pin{
    position:sticky; top:0; height:100svh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* la pantalla: marco vertical, tipo cine/story */
  .pantalla{
    position:relative;
    width:min(84vw, 46svh);
    aspect-ratio: 9 / 16;
    max-height:88svh;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06),
      0 0 60px 10px var(--brillo),
      0 40px 90px rgba(0,0,0,.65);
    transform: scale(.94);
    opacity:0;
  }
  .pantalla__marco{
    position:absolute; inset:0; border-radius:10px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.05);
    pointer-events:none; z-index:6;
  }

  /* la imagen vive detrás de todo, discreta, para dar aire a la sala */
  .pantalla__fondo{ position:absolute; inset:0; z-index:0; }
  .pantalla__fondo img{ width:100%; height:100%; object-fit:cover; object-position:50% 75%; opacity:.34; filter:saturate(1.1) contrast(1.05); }
  .pantalla__velo{
    position:absolute; inset:0; z-index:1;
    background: linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.15) 45%, rgba(0,0,0,.5) 100%);
  }

  /* el nombre: la foto solo existe dentro de las letras */
  .marca-wrap{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:6% 4%;
  }
  .marca{
    margin:0;
    font-weight:400;
    font-size:clamp(2.6rem, 15vw, 4.6rem);
    line-height:.92;
    letter-spacing:.02em;
    background-image: var(--img-marca);
    background-size: 280% auto;
    background-position: 50% 78%;
    background-repeat:no-repeat;
    -webkit-background-clip:text;
    background-clip:text;
    color: rgba(255,255,255,.06); /* respaldo si el navegador no soporta el recorte */
    -webkit-text-fill-color:transparent;
    clip-path: inset(0 100% 0 0);
  }
  .marca span{ display:block; }

  .subtitulo{
    position:relative; z-index:2;
    margin:1.1em 0 0;
    font-style:italic; font-weight:400;
    font-size:clamp(.85rem, 2.6vw, 1.05rem);
    letter-spacing:.07em;
    color:var(--sub);
    opacity:0; transform:translateY(10px);
  }

  /* parpadeo sutil de proyector */
  .parpadeo{
    position:absolute; inset:0; z-index:5; background:#fff; opacity:0; pointer-events:none; mix-blend-mode:overlay;
  }

  .aviso{
    position:fixed; left:50%; bottom:3.2svh; transform:translateX(-50%);
    z-index:9; color:rgba(255,255,255,.4);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:.68rem; letter-spacing:.06em; text-transform:uppercase;
    pointer-events:none;
  }
</style>
</head>
<body>

<section class="sala">
  <div class="sala__pin">
    <div class="pantalla" data-pantalla style="--img-marca:url('assets/img/spa-piscina-cine.webp')">
      <div class="pantalla__fondo"><img src="assets/img/spa-piscina-cine.webp" alt="Piscina interior de La Galiana frente a la montaña" fetchpriority="high" decoding="async"></div>
      <div class="pantalla__velo" aria-hidden="true"></div>
      <div class="marca-wrap">
        <h1 class="marca" data-marca aria-label="La Galiana"><span>LA</span><span>GALIANA</span></h1>
        <p class="subtitulo" data-subtitulo>Bienestar para tu empresa</p>
      </div>
      <div class="parpadeo" data-parpadeo aria-hidden="true"></div>
      <div class="pantalla__marco" aria-hidden="true"></div>
    </div>
  </div>
</section>
<p class="aviso">Desplázate</p>

<script defer src="lib/gsap/gsap.min.js?v=20260823"></script>
<script defer src="lib/gsap/ScrollTrigger.min.js?v=20260823"></script>
<script defer>
(function () {
  "use strict";
  function safe(fn, name) { try { fn(); } catch (e) { console.error("[" + name + "]", e); } }
  function ready(fn) { if (document.readyState !== "loading") fn(); else document.addEventListener("DOMContentLoaded", fn); }

  function initEngine() {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.config({ ignoreMobileResize: true });
    window.addEventListener("load", function () { ScrollTrigger.refresh(); });
  }

  function initCine() {
    var pantalla = document.querySelector("[data-pantalla]");
    var marca = document.querySelector("[data-marca]");
    var sub = document.querySelector("[data-subtitulo]");
    var parpadeo = document.querySelector("[data-parpadeo]");
    if (!pantalla) return;

    // arranque: la sala se enciende cuando la imagen existe, no antes
    var img = pantalla.querySelector(".pantalla__fondo img");
    function open() {
      gsap.to(pantalla, { opacity: 1, scale: 1, duration: 1.1, ease: "power3.out" });
      gsap.fromTo(parpadeo, { opacity: 0 }, { opacity: 0.5, duration: 0.06, repeat: 3, yoyo: true, delay: 0.15 });
    }
    if (img && img.decode) { img.decode().then(open).catch(open); } else { open(); }

    if (!window.gsap || !window.ScrollTrigger) return;

    var tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".sala",
        start: "top top",
        end: "bottom bottom",
        scrub: 0.7,
        invalidateOnRefresh: true
      }
    });

    // la imagen respira dentro de las letras mientras se revela el nombre
    tl.fromTo(marca,
      { clipPath: "inset(0 100% 0 0)", backgroundPosition: "62% 88%" },
      { clipPath: "inset(0 0% 0 0)", backgroundPosition: "50% 78%", ease: "none" }, 0.05);

    tl.fromTo(sub, { opacity: 0, y: 10 }, { opacity: 1, y: 0, ease: "none" }, 0.42);

    // leve deriva continua de la foto, como si siguiera grabando
    tl.to(marca, { backgroundPosition: "38% 66%", ease: "none" }, 0.55);

    // hacia el final, la pantalla se aleja y la sala vuelve a quedar a oscuras
    tl.to(pantalla, { scale: 0.92, opacity: 0, ease: "none" }, 0.85);
  }

  ready(function () {
    safe(initEngine, "initEngine");
    safe(initCine, "initCine");
  });
})();
</script>
</body>
</html>
